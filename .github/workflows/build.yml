name: Build WinLaunch

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:      # 允许在 GitHub 网页上手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # windows-latest 已预装 .NET Framework MSBuild、NuGet 和
      # .NET Framework 4.8 Developer Pack,无需额外 setup。
      # 这里显式定位 .NET Framework 版 MSBuild.exe(避开 dotnet-msbuild
      # 不支持 COM 引用 ResolveComReference 的问题)。
      - name: Locate .NET Framework MSBuild
        id: find-msbuild
        shell: pwsh
        run: |
          $msbuild = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\MSBuild\Current\Bin\MSBuild.exe" -ErrorAction SilentlyContinue |
                    Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $msbuild) {
            $msbuild = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\MSBuild\*\Bin\MSBuild.exe" -ErrorAction SilentlyContinue |
                       Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $msbuild) {
            Write-Error "MSBuild.exe not found. windows-latest should include Build Tools."
            exit 1
          }
          Write-Output "msbuild_path=$($msbuild.FullName)"
          echo "msbuild_path=$($msbuild.FullName)" >> $env:GITHUB_OUTPUT

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          # The csproj resolves the toolkit via HintPath
          # "..\packages\Extended.Wpf.Toolkit.2.2.1\lib\net40\Xceed.Wpf.Toolkit.dll",
          # which is RELATIVE TO THE PROJECT DIR (the repo root). So the packages
          # folder must be the PARENT of the workspace, i.e. .../packages, not
          # repo/packages. Restoring to the wrong folder is what caused MC3074.
          $workspace = $env:GITHUB_WORKSPACE
          $packagesDir = Join-Path (Split-Path $workspace -Parent) 'packages'
          Write-Output "Restoring NuGet packages to: $packagesDir"
          nuget restore WinLaunch.csproj -PackagesDirectory $packagesDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $packagesDir -Recurse -Filter 'Xceed.Wpf.Toolkit.dll' -ErrorAction SilentlyContinue | Select-Object FullName

      # Safety net: fail with a clear message (plus a directory listing) if the
      # toolkit still isn't at the exact HintPath MSBuild expects.
      - name: Verify Xceed.Wpf.Toolkit.dll at HintPath
        shell: pwsh
        run: |
          $packagesDir = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'packages'
          $expected = Join-Path $packagesDir 'Extended.Wpf.Toolkit.2.2.1\lib\net40\Xceed.Wpf.Toolkit.dll'
          if (Test-Path $expected) {
            Write-Output "Toolkit present at HintPath: $expected"
          } else {
            Write-Error "Xceed.Wpf.Toolkit.dll not found at expected HintPath: $expected"
            Get-ChildItem $packagesDir -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }

      - name: Build (Release x64)
        shell: pwsh
        run: |
          & "${{ steps.find-msbuild.outputs.msbuild_path }}" `
            WinLaunch.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /v:minimal

      # csproj 里没有为 HookWindowsKey.dll / XInputDotNetPure.dll /
      # XInputInterface.dll 声明复制规则,这里手动把它们放进输出目录,
      # 否则 exe 启动时会找不到这些依赖。
      - name: Copy native dependencies into output
        shell: pwsh
        run: |
          $out = "bin\x64\Release"
          if (-not (Test-Path $out)) { Write-Error "Output dir missing: $out"; exit 1 }
          foreach ($dll in @("HookWindowsKey.dll","XInputDotNetPure.dll","XInputInterface.dll")) {
            if (Test-Path $dll) {
              Copy-Item $dll $out -Force
              Write-Output "copied $dll -> $out"
            } else {
              Write-Warning "missing: $dll"
            }
          }
          Get-ChildItem $out | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinLaunch-x64
          path: bin/x64/Release
          if-no-files-found: error
